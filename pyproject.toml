[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guidancegrid"
version = "0.1.0"
description = "Reference runtime for OpenGuide — a control plane for LLM inference trajectories."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenGuide" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
obc = ["tomli>=2.0; python_version < '3.11'"]
proxy = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
# T0/T1 open-weight enforcement (activation steering + probes + packs)
signal = ["torch>=2.1", "transformers>=4.40", "safetensors>=0.4", "scikit-learn>=1.3"]
t1 = ["outlines>=0.0.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.110", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["guidancegrid", "proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive"]  # original v0.1.0 drop, preserved verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]  # l as a layer index is idiomatic in this codebase
