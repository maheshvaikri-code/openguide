# OpenGuide local stack: proxy + OTLP collector (Jaeger) + persisted sqlite store.
# One command: `docker compose -f deploy/compose/docker-compose.yml up`
services:
  proxy:
    build:
      context: ../..
      dockerfile: deploy/compose/proxy.Dockerfile
    environment:
      OPENGUIDE_UPSTREAM_BASE_URL: ${OPENGUIDE_UPSTREAM_BASE_URL:-https://api.openai.com}
      OPENGUIDE_UPSTREAM_API_KEY: ${OPENAI_API_KEY:-}
      OPENGUIDE_CONTRACTS_DIR: /app/spec/obc/examples
      OPENGUIDE_ADMIN_TOKEN: ${OPENGUIDE_ADMIN_TOKEN:-}
      OPENGUIDE_TOOL_ALLOWLIST: ${OPENGUIDE_TOOL_ALLOWLIST:-}
      OPENGUIDE_TOOL_DENYLIST: ${OPENGUIDE_TOOL_DENYLIST:-}
      OPENGUIDE_TOOL_REQUIRE_APPROVAL: ${OPENGUIDE_TOOL_REQUIRE_APPROVAL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OPENGUIDE_STORE_DSN: sqlite:/data/openguide.db
    ports:
      - "8088:8088"
    depends_on:
      - jaeger
    volumes:
      - openguide_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC

volumes:
  openguide_data:
